<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeedVR2 启动中</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #e0e0e0;
      overflow: hidden;
    }
    .logo {
      font-size: 48px; font-weight: 700;
      background: linear-gradient(90deg, #e94560, #f39c12);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }
    .subtitle { font-size: 16px; color: #8899aa; margin-bottom: 40px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 14px; color: #aabbcc; min-height: 20px; }
    .error {
      color: #e94560; margin-top: 16px;
      font-size: 13px; max-width: 400px;
      text-align: center; line-height: 1.6;
    }
    .btn {
      margin-top: 20px; padding: 8px 24px;
      background: #e94560; color: #fff;
      border: none; border-radius: 4px;
      cursor: pointer; font-size: 14px;
    }
    .btn:hover { background: #d63851; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="logo">SeedVR2</div>
  <div class="subtitle">AI 图片修复 · 桌面版</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">正在启动 Python 运行时...</div>
  <div class="error hidden" id="error"></div>
  <button class="btn hidden" id="retryBtn" onclick="window.__TAURI__.invoke('retry_start')">重试</button>

  <script>
    // 监听来自 Rust 的状态更新
    if (window.__TAURI__) {
      window.__TAURI__.event.listen('startup-status', (event) => {
        const data = event.payload;
        document.getElementById('status').textContent = data.message || '';
        if (data.error) {
          document.getElementById('spinner').classList.add('hidden');
          document.getElementById('error').textContent = data.error;
          document.getElementById('error').classList.remove('hidden');
          document.getElementById('retryBtn').classList.remove('hidden');
        }
      });
    }
  </script>
</body>
</html>
