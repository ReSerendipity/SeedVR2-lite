name: CI - Desktop Shell (Rust/Tauri)

# 桌面壳（desktop/src-tauri，Tauri v2 / Rust）此前没有任何可执行验证器：precheck.ps1 四步与
# 19 条 CI workflow 只跑 Python/CodeQL，AGENTS.md §2 声明的 cargo test / cargo clippy 从未被
# 串联进任何门禁。本 workflow 把这层接线补上——只在桌面壳相关文件改动时触发，作为独立、并行
# 于后端质量门禁（ci.yml）的最小机械验证入口。
#
# 本地未分发引用：AGENTS.md、precheck.ps1 —— 上文提到的这两份是维护者本地文件，不随仓库
# 分发（AGENTS.md §2 的桌面壳门禁口径已摘进 docs/CODING_STANDARDS.md 第 5 节；precheck.ps1
# 缺失时 .githooks 自动降级为根目录守卫）。可执行口径以本 workflow 自身为准。
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-shell.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-shell.yml'

permissions:
  contents: read

concurrency:
  group: desktop-shell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: Rust clippy + test (windows)
    # runs-on=windows-latest：Cargo.toml 依赖 winreg（Windows 专有），且 Tauri v2 在 Linux
    # 编译需 webkit2gtk 等系统库、在 CI 里不稳定；Windows runner 自带 WebView2 / Windows SDK，
    # 开箱即可编译测试。桌面壳本就是 Windows 优先交付物，此选型与其真实目标平台一致。
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # 构建产物滚动清理铁律（AGENTS.md，2026-09-17）说明：CI runner 是一次性环境，target/ 随
      # VM 销毁自动回收、不会落入本仓工作树磁盘，因此这里【不】执行 cargo clean——那只会清空
      # rust-cache 复用的构建图、拖慢每次运行。铁律针对的是本地开发机的磁盘累积，非 ephemeral CI。

      - name: Permission-mirror integrity (capabilities allow-* ↔ tracked autogenerated/*.toml)
        # 安全边界哨兵：capabilities/main.json 里每条应用自定义权限 allow-<cmd> 都必须有对应的
        # tracked 权限镜像文件 permissions/autogenerated/<cmd>.toml（由 build.rs 的 AppManifest::commands
        # 经 tauri-build/CLI 生成）。这条能捕获 cargo 自身【静默容忍】的能力/权限漂移——即本次
        # 「未跟踪且未忽略」三不管 bug 的根因（generate_handler 加了命令，build.rs/toml 没跟上）。
        working-directory: desktop/src-tauri
        run: |
          missing=0
          for p in $(grep -oE '"allow-[a-z0-9-]+"' capabilities/main.json | tr -d '"' | sed 's/^allow-//; s/-/_/g' | sort -u); do
            if [ ! -f "permissions/autogenerated/$p.toml" ]; then
              echo "::error::capabilities/main.json 引用了 allow-$(echo "$p" | tr '_' '-')，但 permissions/autogenerated/$p.toml 缺失（未纳入跟踪）"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "PASS: 每条 allow-* 能力都有对应的 tracked 权限镜像文件"
          else
            echo "修复：在 build.rs 的 AppManifest::commands 补上该命令，重新生成并提交 permissions/autogenerated/*.toml"
            exit 1
          fi

      - name: "Clippy (AGENTS.md §2: cargo clippy --all-targets -- -D warnings)"
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: "Test (AGENTS.md §2: cargo test)"
        working-directory: desktop/src-tauri
        run: cargo test --locked
