# .github/workflows/gpu-smoke.yml
# Weekly + manual REAL-INFERENCE smoke on a self-hosted GPU runner (label: gpu).
#
# Closes the hardware blind spot of portable-release.yml: hosted runners have no GPU,
# so the release gate only proves packaging correctness (boot / route / CSRF / torch
# import), never "the model actually repairs an image". This workflow downloads a
# published portable release, unpacks it exactly like an end user, and forces one real
# restore task (--require-inference).
#
# Runner prerequisites (one-time, on the GPU machine):
#   1. Register a self-hosted runner with the extra label `gpu`
#      (Settings -> Actions -> Runners -> New self-hosted runner -> --labels gpu)
#   2. gh CLI on PATH (release asset download)
#   3. Python 3.11+ on PATH (the smoke script is stdlib-only)
#   4. NVIDIA driver ready; ~7 GB free disk for download + unpack
# Without an online `gpu` runner the weekly schedule skips itself (see runner-precheck).
name: GPU Smoke (real inference, self-hosted)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to smoke (empty = newest published release)"
        required: false
        default: ""
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC

permissions:
  contents: read

jobs:
  runner-precheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check for an online self-hosted GPU runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::REPO_ADMIN_TOKEN secret not configured - cannot query runner status, skipping smoke"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # runners 列表 API 需要管理员级 token（GITHUB_TOKEN 即使 actions:read 也 403）
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "gpu"))] | length')
          echo "online gpu-labelled runners: ${COUNT}"
          if [ "${COUNT}" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no online self-hosted runner with label 'gpu'; weekly smoke skipped"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  gpu-smoke:
    needs: runner-precheck
    if: needs.runner-precheck.outputs.available == 'true'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 150
    steps:
      - name: Fetch workflow scripts via codeload source archive
        shell: pwsh
        run: |
          # 本 runner 网络下 git smart-HTTP 长连接不稳（checkout@v4 实测 20+ 分钟零推进），
          # codeload 源码包通道实测 1s 内返回；只取三个脚本文件，整包也仅数 MB。
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $ref = "${{ github.ref_name }}"
          Invoke-WebRequest "https://codeload.github.com/${{ github.repository }}/tar.gz/refs/heads/$ref" -OutFile src.tgz -UseBasicParsing
          New-Item -ItemType Directory -Path src -Force | Out-Null
          tar -xzf src.tgz -C src --strip-components=1
          New-Item -ItemType Directory -Path scripts -Force | Out-Null
          Copy-Item src\scripts\unpack_portable_bundle.ps1, src\scripts\portable_bundle_lib.ps1, src\scripts\smoke_portable_bundle.py scripts\
          Remove-Item src.tgz -Force
          Write-Host "src/ 保留：image_metrics.py 作为质量门对历史便携包的模块回退"
          Get-ChildItem scripts | Select-Object Name, Length

      - name: Resolve target release tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $t = "${{ github.event.inputs.tag }}"
          if (-not $t) {
            $t = gh release list --limit 20 --json tagName,isDraft,isPrerelease |
              ConvertFrom-Json |
              Where-Object { -not $_.isDraft -and -not $_.isPrerelease } |
              Select-Object -First 1 -ExpandProperty tagName
          }
          if (-not $t) { throw "no published release found" }
          Write-Host "smoking release: $t"
          "tag=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Download release assets (resumable, stall-aware, official-first with mirror fallback)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 本机到 GitHub CDN 的带宽按数十分钟尺度剧烈波动（实测 5MB/s ↔ 4KB/s 互切，
          # 单连接还可能 TCP 挂死）。对策：curl --speed-limit 61440 --speed-time 60 令
          # 停滞连接 60s 内主动断开（exit 28），外层按文件做多轮 resume 循环
          # （-C - 续传），在 150+ 分钟窗口内自动骑上网络恢复的波段；
          # 官方通道与公共镜像逐轮交替。无论来源，解包步骤按 manifest/SHA256SUMS
          # 逐卷强制 SHA256，损坏与篡改必被发现。
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path bundle -Force | Out-Null
          $tag = "${{ steps.tag.outputs.tag }}"
          $assets = @(gh release view $tag --json assets -q '.assets[].name')
          $direct = "https://github.com/${{ github.repository }}/releases/download/$tag"
          $mirror = "https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download/$tag"
          $curlBase = @('-sSL', '--ssl-no-revoke', '-C', '-', '--speed-limit', '61440', '--speed-time', '60')
          foreach ($name in $assets) {
            $out = Join-Path bundle $name
            $done = $false
            for ($round = 1; $round -le 8 -and -not $done; $round++) {
              $base = if ($round % 2) { $direct } else { $mirror }
              Write-Host "GET $name round $round via $($base.Split('/')[2])"
              curl.exe @curlBase -o $out "$base/$name"
              # 0=完整 33=range 416(已完整) → 成功；28=停滞/超时 → 下一轮续传
              if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 33) { $done = $true }
              elseif ($LASTEXITCODE -eq 28) { Write-Host "  stalled, resuming next round ($([int]((Get-Item $out -ErrorAction SilentlyContinue).Length/1MB)) MB so far)"; Start-Sleep -Seconds 15 }
              else { Write-Host "  curl exit $LASTEXITCODE, next round"; Start-Sleep -Seconds 20 }
            }
            if (-not $done) { throw "failed to download asset after 8 rounds: $name" }
            Write-Host ("  ok  {0}  {1:N1} MB" -f $name, ((Get-Item $out).Length / 1MB))
          }
          Get-ChildItem bundle |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - name: Unpack (per-volume SHA256 -> merge -> extract -> offline torch install)
        shell: pwsh
        run: |
          # GitHub Windows runner 的 PATH 含 Git 的 usr\bin，GNU tar 会把 C:\ 当远程主机
          # （KNOWN_ISSUES #35）；历史 Release 资产内嵌的解包 lib 早于修复，故在步骤内
          # 前置 System32 让 bsdtar 优先（不动 job 级 env，避免覆盖 Actions 注入的 gh 路径）。
          $env:Path = 'C:\Windows\System32;C:\Windows;' + $env:Path
          $target = Join-Path $PWD 'target'
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\unpack_portable_bundle.ps1 `
            -BundleDir "$PWD\bundle" -TargetDir $target
          if ($LASTEXITCODE -ne 0) { throw "unpack failed" }

      - name: Smoke with REAL inference + quality gate (--require-inference --quality-gate)
        shell: pwsh
        run: |
          python .\scripts\smoke_portable_bundle.py `
            --app-dir (Join-Path $PWD 'target\SeedVR2-Portable') `
            --require-inference --quality-gate --min-psnr 15 --min-ssim 0.5 `
            --metrics-module (Join-Path $PWD 'src\app\integrated_app\utils\image_metrics.py') `
            --boot-timeout 900 --task-timeout 1800 --resolution 512
          if ($LASTEXITCODE -ne 0) { throw "GPU smoke failed" }
