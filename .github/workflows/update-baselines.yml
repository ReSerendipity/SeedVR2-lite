name: Update Baselines

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '确认在 CI (Linux) 环境重新生成视觉回归 baseline（产出 visual-regression-baselines artifact，由维护者落地）'
        required: true
        default: 'yes'

concurrency:
  group: update-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-baselines:
    name: Regenerate visual regression baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 本 workflow 不写仓库：基线只经 artifact 交付（见下方 Verify 步的说明），
    # 所以按最小权限显式降到 read，而不是留 contents: write 给一条推不动的步骤。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright (TS)
        run: |
          cd tests
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate test assets (test-assets ignored by git, regenerated on CI)
        run: |
          python tests/generate_test_assets.py

      - name: Start app server in background
        run: |
          python app/integrated_app/app_server.py &
        env:
          PYTHONUNBUFFERED: '1'

      - name: Wait for server ready
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:7870/api/system/health

      - name: Regenerate baselines (Linux rendering)
        run: |
          cd tests
          npx playwright test specs/uiux-compatibility.spec.ts \
            --project=chromium-desktop --update-snapshots --reporter=line

      - name: Verify baselines produced (artifact is the only delivery channel)
        run: |
          SNAP=tests/specs/uiux-compatibility.spec.ts-snapshots
          # 基线必须真实产出（12 个视觉项 × chromium/linux 平台后缀）；若目录缺失或
          # 不足则显式失败——否则问题会被静默吞掉（2026-09-07：旧实现在全部视觉项被
          # skip 时 git diff 直接 "did not match any files" exit 128，无任何有效信号）。
          if [ ! -d "$SNAP" ]; then
            echo "::error::snapshots dir not created by --update-snapshots run"
            exit 1
          fi
          count=$(find "$SNAP" -name "*-linux.png" | wc -l)
          echo "linux baselines: $count (expect 12)"
          [ "$count" -ge 12 ] || { echo "::error::fewer than 12 linux baselines generated"; exit 1; }
          # 这里原先有一段 `git add -f` + `git commit` + `git push origin HEAD:main`，
          # 已整条删除。直推 main 从未成功过一次：run 34078396828（Update Baselines #4）
          # 里是 `remote: error: GH006: Protected branch update failed for refs/heads/main`
          # → `! [remote rejected] HEAD -> main (protected branch hook declined)`；main 历史
          # 里 `git log --grep="chore(e2e)"` 为空。更糟的是随后一版（run 34078718912 / #5）
          # 把拒推降级成一条 ::warning 就 exit 0，于是"什么都没落地"的 run 与"基线已更新"
          # 的 run 在结论上长得一样（该步 conclusion=success，日志里同时有
          # `##[warning]protected branch declined direct push`）。基线的真实落地通道一直是
          # artifact + 维护者提交：12 张 linux 基线即经此入库，commit 178d9c3
          # （"落地 CI linux 视觉回归基线 12 张（E1 bootstrap，经 artifact 通道）"）。
          # 删除后本步只保留产出量校验，success 才诚实表示"基线产物已生成并随 artifact 上传"。

      - name: Upload baselines artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-regression-baselines
          path: tests/specs/uiux-compatibility.spec.ts-snapshots/
          retention-days: 14
