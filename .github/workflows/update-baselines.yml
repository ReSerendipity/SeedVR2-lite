name: Update Baselines

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '确认在 CI (Linux) 环境重新生成视觉回归 baseline 并自动提交'
        required: true
        default: 'yes'

concurrency:
  group: update-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-baselines:
    name: Regenerate visual regression baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright (TS)
        run: |
          cd tests
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate test assets (test-assets ignored by git, regenerated on CI)
        run: |
          python tests/generate_test_assets.py

      - name: Start app server in background
        run: |
          python app/integrated_app/app_server.py &
        env:
          PYTHONUNBUFFERED: '1'

      - name: Wait for server ready
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:7870/api/system/health

      - name: Regenerate baselines (Linux rendering)
        run: |
          cd tests
          npx playwright test specs/uiux-compatibility.spec.ts \
            --project=chromium-desktop --update-snapshots --reporter=line

      - name: Commit and push baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SNAP=tests/specs/uiux-compatibility.spec.ts-snapshots
          # 基线必须真实产出（12 个视觉项 × chromium/linux 平台后缀）；
          # 若目录缺失或不足则显式失败——否则问题会被 else 分支静默吞掉
          # （2026-09-07：旧实现在全部视觉项被 skip 时 git diff 直接
          #  "did not match any files" exit 128，无任何有效信号）
          if [ ! -d "$SNAP" ]; then
            echo "::error::snapshots dir not created by --update-snapshots run"
            exit 1
          fi
          count=$(find "$SNAP" -name "*-linux.png" | wc -l)
          echo "linux baselines: $count (expect 12)"
          [ "$count" -ge 12 ] || { echo "::error::fewer than 12 linux baselines generated"; exit 1; }
          if ! git diff --quiet -- "$SNAP" || git ls-files --others --exclude-standard -- "$SNAP" | grep -q .; then
            git add -f "$SNAP"
            git commit -m "chore(e2e): update visual regression baselines (linux, update-baselines workflow)"
            git push origin HEAD:main || {
              echo "push failed (branch protection or race) - baselines committed locally only"
              git log --oneline -1
            }
          else
            echo "no baseline changes"
          fi
