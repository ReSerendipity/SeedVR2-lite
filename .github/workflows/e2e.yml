name: CI - E2E Playwright

on:
  # 故意不加 paths 过滤：本 workflow 的 3 个 job 是 main 的必需检查。被路径过滤掉的
  # workflow 一个 check run 都不产生，必需检查就会永远停在 "Expected"，纯文档 PR 直接
  # 卡死合不进去——main 的 6b0d7a0 就是实例（docs 合并没有触发 E2E）。
  # 代价：文档类 PR 也要等一轮 E2E 矩阵（约 6-13 分钟）。
  pull_request:
    branches: [main]
  # push 侧保留过滤：main 上的 E2E 只是事后验证，没有东西在等它，不必为文档改动跑矩阵。
  push:
    branches: [main]
    paths:
      - 'app/integrated_app/**'
      - 'tests/specs/**'
      - 'tests/pages/**'
      - 'tests/fixtures/**'
      - 'tests/utils/**'
      - 'tests/playwright.config.ts'
  workflow_dispatch:

permissions:
  contents: read

# 同 PR 的新推送会取代旧运行的结论：取消旧运行，只留最新一次。
# push（含 main 上的正式验证）不取消——那条是权威记录，不能被后来的推送半路掐掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, firefox-desktop, webkit-desktop]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.project }}-${{ hashFiles('tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ matrix.project }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright dependencies
        run: |
          cd tests
          npm ci
          npx playwright install --with-deps ${{ matrix.project == 'firefox-desktop' && 'firefox' || matrix.project == 'webkit-desktop' && 'webkit' || 'chromium' }}

      - name: Generate test assets (test-assets ignored by git, regenerated on CI)
        run: |
          python tests/generate_test_assets.py

      - name: Start app server in background
        run: |
          python app/integrated_app/app_server.py &
        env:
          PYTHONUNBUFFERED: '1'

      - name: Wait for server ready
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:7870/api/system/health

      # Visual regression: baselines are committed win32 PNGs, compared with
      # spec-level maxDiffPixelRatio: 0.01 tolerance for cross-OS rendering
      # differences. NEVER pass --update-snapshots here: Playwright would
      # rewrite every differing snapshot instead of failing, silently
      # disabling the visual gate (this regression slipped back in and was
      # removed again on 2026-08-30). To regenerate baselines, run the
      # update-baselines.yml workflow manually.
      - name: Run Playwright tests
        run: cd tests && npx playwright test --project=${{ matrix.project }} --reporter=github,list

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: tests/playwright-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-${{ matrix.project }}
          path: tests/test-results/
