name: Dependency Audit

on:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - 'pyproject.toml'
      - 'tests/package.json'
      - 'tests/package-lock.json'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # 必须与锁的平台一致：requirements-lock.txt 的 --hash 是 Windows 轮实测值，
    # ubuntu 解析 manylinux 轮必报 hash mismatch（pip-audit -r 模式必定走 pip
    # 下载校验，--no-deps 只跳过传递依赖解析，2026-08-30 两轮实测）
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # pip-audit -r 模式会以 pip --dry-run 下载各钉版轮子校验哈希（torch cu132
          # Windows 轮 ~2.5GB），按锁文件内容缓存下载产物，冷跑一次后免重复下载
          cache: 'pip'
          cache-dependency-path: 'requirements-lock.txt'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on requirements
        env:
          # requirements-lock.txt 里 torch/torchvision 是 +cu132 本地版本号，仅存在于
          # PyTorch 源；不注入 extra index 时 pip 在 PyPI 找不到分发，触及依赖清单的
          # PR 与每周定时审计必红（pip-audit 需真实安装被审环境）
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu132
        run: |
          if [ -f requirements-lock.txt ]; then
            # --no-deps：锁文件已全量钉版（含传递依赖），跳过依赖解析；
            # 注意它并不能跳过哈希校验——pip 仍会逐包下载校验 --hash，
            # 因此本 job 必须跑在与锁一致的 windows 平台（2026-08-30 ubuntu 实测必红）
            pip-audit -r requirements-lock.txt --no-deps || exit 1
          elif [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || exit 1
          else
            echo "No requirements file found, skipping audit"
          fi

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --json
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Run npm audit
        run: |
          cd tests
          npm audit --audit-level=moderate || exit 1
