name: Dependency Audit

on:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - 'pyproject.toml'
      - 'tests/package.json'
      - 'tests/package-lock.json'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on requirements
        env:
          # requirements-lock.txt 里 torch/torchvision 是 +cu132 本地版本号，仅存在于
          # PyTorch 源；不注入 extra index 时 pip 在 PyPI 找不到分发，触及依赖清单的
          # PR 与每周定时审计必红（pip-audit 需真实安装被审环境）
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cu132
        run: |
          if [ -f requirements-lock.txt ]; then
            # --no-deps：requirements-lock.txt 是全量钉版（含传递依赖），无需真实安装；
            # 哈希是 Windows 轮子的，ubuntu 上安装必报 hash mismatch（2026-08-30 实测），
            # 跳过解析/安装后可跨平台审计且免去 ~3GB 的 torch 轮子下载
            pip-audit -r requirements-lock.txt --no-deps || exit 1
          elif [ -f requirements.txt ]; then
            pip-audit -r requirements.txt || exit 1
          else
            echo "No requirements file found, skipping audit"
          fi

      - name: Install safety
        run: pip install safety

      - name: Run safety check
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --json
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Run npm audit
        run: |
          cd tests
          npm audit --audit-level=moderate || exit 1
