name: Stale 自动清理

on:
  schedule:
    - cron: '0 3 * * *'  # 每天 UTC 03:00（北京时间 11:00）

permissions:
  issues: write
  pull-requests: write

# 本 workflow 有写副作用（开 auto-merge / 评论与关闭 issue）：同 ref 串行执行但**不取消**，
# 取消掉正在开启自动合并的那个作业会让 PR 静默卡住。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-issue-stale: 60
          days-before-pr-stale: 60
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-message: "该 issue 已 60 天无活动，将在 7 天后自动关闭。如仍需处理请回复。"
          stale-pr-message: "该 PR 已 60 天无活动，将在 7 天后自动关闭。如仍需处理请回复。"
          close-issue-message: "因长期无活动，此 issue 已自动关闭。"
          close-pr-message: "因长期无活动，此 PR 已自动关闭。"
          exempt-issue-labels: "pinned,security,bug,enhancement"
          exempt-pr-labels: "pinned,security,dependencies"
          operations-per-run: 100
