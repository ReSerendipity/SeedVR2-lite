# .github/workflows/desktop-release.yml
# 桌面发行：构建启动器（PyInstaller）→ 预装小依赖 → 编译安装包（ISCC）→ 上传。
# 触发方式：
#   - workflow_dispatch：手动验证构建（不上传 Release，只留 workflow artifact）
#   - push tag v*：构建并上传安装包到对应 Release（GPG 签名由 gpg-signed-release.yml
#     在 release published 时自动完成，本工作流不重复签名）
name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载便携 WinPython 3.12.10.1（GitHub Release 资产）
        shell: powershell
        run: |
          $url = "https://github.com/winpython/winpython/releases/download/16.5.20250614/Winpython64-3.12.10.1dotb4.exe"
          $ok = $false
          foreach ($i in 1..3) {
            try {
              Invoke-WebRequest -Uri $url -OutFile WPy.exe -UseBasicParsing -TimeoutSec 300
              $ok = $true
              break
            } catch {
              Write-Output "download attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 5
            }
          }
          if (-not $ok) { throw "WinPython download failed after 3 attempts" }
          Write-Output "downloaded WPy.exe size: $((Get-Item WPy.exe).Length)"

      - name: 解压 WinPython 到 WPy64-312101
        shell: powershell
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { throw "7-Zip not found on runner" }
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\wp" -Force | Out-Null
          & $sevenZip x WPy.exe "-o$env:RUNNER_TEMP\wp" -y | Out-Null
          # 归档内含顶层目录（如 WPy64-312101b4），整理为约定的 WPy64-312101
          $wpRoot = Get-ChildItem "$env:RUNNER_TEMP\wp" -Directory | Select-Object -First 1
          if (-not $wpRoot) { throw "no WinPython root extracted" }
          Move-Item $wpRoot.FullName WPy64-312101
          # 删除 python 目录联接（reparse point）：ISCC 无法跟随，会导致"找不到路径"编译失败
          $pyLink = "WPy64-312101\python"
          if (Test-Path $pyLink) {
            $it = Get-Item $pyLink -Force
            if ($it.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              [System.IO.Directory]::Delete($pyLink)
              Write-Output "removed python junction"
            }
          }
          $py = Get-ChildItem WPy64-312101 -Recurse -Filter python.exe | Select-Object -First 1
          if (-not $py) { throw "python.exe not found after extraction" }
          Write-Output "PYTHON=$($py.FullName)"
          Write-Output "PYVER=$(& $py.FullName --version)"

      - name: 预装小依赖（torch 家族除外，torch 由启动器首启安装）
        shell: powershell
        run: |
          $py = Get-ChildItem WPy64-312101 -Recurse -Filter python.exe | Select-Object -First 1
          & $py.FullName -m pip install --upgrade pip
          & $py.FullName -m pip install -r launcher\requirements-small.txt --timeout 300 --retries 3
          # diffusers/transformers 会硬依赖 torch，装完小依赖后必须移除 torch 家族，
          # 否则会被打进安装包（膨胀到 3GB+ 且超 GitHub 2GB 单文件限制）
          & $py.FullName -m pip uninstall -y torch torchvision torchaudio
          Write-Output "torch family removed from bundled python"

      - name: 构建启动器（PyInstaller，含静态资源）
        shell: powershell
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name SeedVR2 --paths . --add-data "launcher\static;launcher\static" launcher\launcher_main.py
          Get-Item dist\SeedVR2.exe | Select-Object Name, Length

      - name: 下载 torch 家族 wheels（cu128，供 Torch 分卷包使用）
        shell: powershell
        run: |
          $py = Get-ChildItem WPy64-312101 -Recurse -Filter python.exe | Select-Object -First 1
          if (-not $py) { throw "python.exe not found" }
          New-Item -ItemType Directory -Path dist\torch_wheels -Force | Out-Null
          # CI runner 在 GitHub 托管环境，访问官方源较快；用 --no-deps 只取 torch 家族本体
          & $py.FullName -m pip download torch torchvision torchaudio `
            --index-url https://download.pytorch.org/whl/cu128 `
            -d dist\torch_wheels --no-deps --timeout 300 --retries 3
          if ($LASTEXITCODE -ne 0) { throw "pip download torch wheels failed" }
          Get-ChildItem dist\torch_wheels | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          $total = (Get-ChildItem dist\torch_wheels | Measure-Object Length -Sum).Sum
          Write-Output "torch wheels total: $([math]::Round($total/1GB,2)) GB"

      - name: 构建安装包（ISCC）
        shell: powershell
        run: |
          # 版本号：tag（v1.2.0 → 1.2.0）优先，手动触发回退到 pyproject
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(.+)$') { $appVer = $Matches[1] }
          else { $appVer = & python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])" }
          Write-Output "AppVersion=$appVer"
          # 从 GitHub Release 下载 Inno Setup 6.7.3（jrsoftware.org 在 runner 上连不上）
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri $url -OutFile is.exe -UseBasicParsing -TimeoutSec 300
          Start-Process -FilePath ".\is.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","${env:ProgramFiles}\Inno Setup 6\ISCC.exe","${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after install" }
          Write-Output "ISCC: $($iscc.FullName)"

          # 1. Full 包 (~350MB)：WinPython + app 代码 + 启动器
          Write-Output "Building Full package..."
          & $iscc.FullName "/DAppVer=$appVer" launcher\installer_full.iss

          # 2. Torch 分卷包：torch cu128 wheel 单文件 2.7GB，DiskSpanning 拆成 <2GB 多个 .bin
          Write-Output "Building Torch package..."
          & $iscc.FullName "/DAppVer=$appVer" launcher\installer_torch.iss

          Get-ChildItem dist\SeedVR2-Setup-Full-*.exe, dist\SeedVR2-Torch-Installer-*.* | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: 生成 SHA256SUMS
        shell: powershell
        run: |
          Get-ChildItem dist\SeedVR2-Setup-Full-*.exe, dist\SeedVR2-Torch-Installer-*.* | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content dist\SHA256SUMS -Encoding ascii

      - name: 上传安装包为 workflow artifact（验证构建）
        uses: actions/upload-artifact@v4
        with:
          name: SeedVR2-Installers
          path: |
            dist/SeedVR2-Setup-Full-*.exe
            dist/SeedVR2-Torch-Installer-*
            dist/SHA256SUMS

      - name: 打 tag 时上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # release-please 可能已创建 Release，已存在则忽略
          gh release create $tag --title "$tag" --generate-notes 2>$null
          # 组装发布说明：新手安装指引（顶部）+ 自动 changelog
          $body = gh release view $tag --json body -q .body 2>$null
          $intro = Get-Content -Raw launcher\release-notes-intro.md
          $bodyFile = Join-Path $env:RUNNER_TEMP "relbody.md"
          ($intro + "`n" + $body) | Set-Content -Path $bodyFile -Encoding utf8
          gh release edit $tag --notes-file $bodyFile
          # 上传所有产物：Full 包 + Torch 分卷包（exe + 多个 .bin）
          $files = @()
          $files += Get-ChildItem dist\SeedVR2-Setup-Full-*.exe
          $files += Get-ChildItem dist\SeedVR2-Torch-Installer-*.*
          foreach ($f in $files) {
            gh release upload $tag "$($f.FullName)" --clobber
          }
          gh release upload $tag dist\SHA256SUMS --clobber
