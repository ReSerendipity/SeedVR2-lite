# .github/workflows/portable-release.yml
# Portable offline multi-volume release bundles: 4 components -> volumes, every file < 2 GiB,
# uploaded to GitHub Release.
#
# Relationship with desktop-release.yml: this is the tag-triggered release path. The Inno Setup
# exe path was reduced to workflow_dispatch-only on 2026-08-28, so the two no longer compete
# for the same Release. Rationale: docs/project/PORTABLE_BUNDLES.md (local-only doc).
#
# Components and expected volume count (1+2+1+2 = 6 volumes, ~5.6 GB total):
#   core          app code + WinPython portable interpreter (torch family removed)     1 vol  ~0.2 GB
#   torch         PyTorch cu128 wheels incl. transitive deps (installed offline)       2 vol  ~2.8 GB
#   model-shared  ema_vae_fp16 + pos_emb + neg_emb                                     1 vol  ~0.45 GB
#   model-fp8     seedvr2_ema_3b_fp8_e4m3fn (the one bundled main model)               2 vol  ~2.17 GB
#
# IMPORTANT - keep every `run:` block ASCII-only. GitHub writes the step body to a temp .ps1
# without a BOM and runs it under Windows PowerShell 5.1, which decodes BOM-less files using the
# ANSI codepage: non-ASCII literals come out mojibake and can even break parsing. Step `name:`
# values are safe (the YAML itself is parsed as UTF-8).
name: Portable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则依次取 tag / pyproject.toml）"
        required: false
        default: ""
      components:
        description: "要构建的组件，逗号分隔"
        required: false
        default: "core,torch,model-shared,model-fp8"
      upload_to_release:
        description: "是否上传到 GitHub Release（false 时只留 workflow artifact）"
        type: boolean
        required: false
        default: false
      require_gpu_inference:
        description: "冒烟是否强制跑完一次真实推理（需 self-hosted GPU runner；托管 runner 无 GPU）"
        type: boolean
        required: false
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-bundles:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BUNDLE_DIR: ${{ github.workspace }}\dist\bundles
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 解析版本号
        id: ver
        shell: powershell
        run: |
          $ref = "${{ github.ref_name }}"
          $inputVer = "${{ github.event.inputs.version }}"
          if ($ref -match '^v(.+)$') {
            $v = $Matches[1]
          } elseif ($inputVer) {
            $v = $inputVer
          } else {
            $v = (& python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          }
          if (-not $v) { throw "cannot resolve version" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          Write-Host "bundle version: $v"

      - name: 安装下载依赖
        shell: powershell
        run: python -m pip install --upgrade pip huggingface_hub

      - name: 从 config.yaml 取所需权重文件名
        id: files
        shell: powershell
        run: |
          # Single source of truth for weight filenames: the build script reads config.yaml.
          $names = & .\scripts\build_portable_bundle.ps1 -PrintModelFiles
          if ($LASTEXITCODE -ne 0) { throw "-PrintModelFiles failed" }
          $names = @($names | Where-Object { $_ })
          if ($names.Count -lt 1) { throw "no weight filenames resolved" }
          Write-Host "required weights: $($names -join ', ')"
          "names=$($names -join ' ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: 下载便携包模型权重
        shell: powershell
        run: |
          # 只从 HF 下 safetensors（3b FP8 主权重 + VAE）。pos_emb/neg_emb 是仓库内嵌资产
          # （scripts/bundle_assets/），由 build_portable_bundle.ps1 直接打包，不在此联网拉取
          # （HF 社区仓库 numz/SeedVR2_comfyUI 缺失这两个 .pt，返回 404）。
          $names = "${{ steps.files.outputs.names }}".Split(' ') | Where-Object { $_ -match '\.safetensors$' }
          if ($names.Count -lt 1) { throw "no safetensors to download from HF" }
          $argv = @("scripts/download_model.py", "--files") + $names
          & python $argv
          if ($LASTEXITCODE -ne 0) { throw "model weight download failed" }
          Get-ChildItem model | Select-Object Name, @{n='GB';e={[math]::Round($_.Length/1GB,3)}} | Format-Table -AutoSize

      - name: 构建分卷包
        shell: powershell
        run: |
          $comp = "${{ github.event.inputs.components }}"
          if (-not $comp) { $comp = "core,torch,model-shared,model-fp8" }
          $list = @($comp.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          Write-Host "building components: $($list -join ', ')"
          # -Format zip so end users can extract with built-in tar.exe / Explorer (no 7-Zip needed).
          & .\scripts\build_portable_bundle.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -Component $list `
            -OutDir $env:BUNDLE_DIR `
            -Format zip
          if ($LASTEXITCODE -ne 0) { throw "bundle build failed" }
          Get-ChildItem $env:BUNDLE_DIR -File |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: 体积门禁复核
        id: gate
        shell: powershell
        run: |
          $limit = 2147483648
          $all = @(Get-ChildItem $env:BUNDLE_DIR -File | Where-Object { $_.Name -ne 'upload-list.txt' })
          foreach ($f in $all) { Write-Host ("{0,10:N1} MB  {1}" -f ($f.Length/1MB), $f.Name) }
          $bad = @($all | Where-Object { $_.Length -gt $limit })
          if ($bad.Count -gt 0) {
            foreach ($f in $bad) { Write-Host "::error::oversize asset, refusing to upload: $($f.Name)" }
            throw "one or more artifacts exceed the GitHub 2 GiB per-file limit"
          }
          $total = ($all | Measure-Object Length -Sum).Sum
          Write-Host "artifacts total: $([math]::Round($total/1GB,2)) GB"
          "total_gb=$([math]::Round($total/1GB,2))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: 解包冒烟验收（发布前门禁）
        shell: powershell
        run: |
          # Real unpacker run against the freshly produced volumes: per-part SHA256 -> merge ->
          # extract -> offline torch install -> manifest cross-check. Equivalent to a user's first install.
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'portable-smoke'
          & .\scripts\unpack_portable_bundle.ps1 -BundleDir $env:BUNDLE_DIR -TargetDir $smokeRoot
          if ($LASTEXITCODE -ne 0) { throw "unpack failed, refusing to publish" }
          $appDir = Join-Path $smokeRoot 'SeedVR2-Portable'
          if (-not (Test-Path $appDir)) { throw "unpack did not produce $appDir" }

          # Smoke: start portable server -> health -> CSRF double-submit -> restore task -> verify output.
          # Hosted windows runners have no GPU, so real inference is not required here; but any packaging
          # level error (server won't boot, 404 route, 403 CSRF, import failure, corrupt output) fails hard.
          # On a self-hosted GPU runner, set require_gpu_inference=true to force a real restore.
          $extra = @()
          if ('${{ github.event.inputs.require_gpu_inference }}' -eq 'true') { $extra += '--require-inference' }
          & python .\scripts\smoke_portable_bundle.py --app-dir $appDir --boot-timeout 900 --submit-timeout 900 --task-timeout 1800 --resolution 512 --keep-log @extra
          if ($LASTEXITCODE -ne 0) { throw "post-unpack smoke gate failed, refusing to publish" }
          $log = Join-Path $appDir 'logs\smoke_portable.log'
          if (Test-Path $log) { Get-Content $log -Tail 20 -Encoding UTF8 | ForEach-Object { Write-Host "  | $_" } }

      - name: 保留为 workflow artifact（未发布 Release 时）
        if: github.event_name == 'workflow_dispatch' && !inputs.upload_to_release
        uses: actions/upload-artifact@v4
        with:
          name: SeedVR2-Portable-${{ steps.ver.outputs.version }}-win-x64
          path: dist/bundles/**
          retention-days: 5
          if-no-files-found: error

      - name: 创建或确认 Release
        if: github.event_name == 'push' || inputs.upload_to_release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          # ASCII-only title: PS 5.1 decodes this BOM-less step script with the ANSI codepage.
          gh release create $tag --title "SeedVR2 $tag (portable offline bundles)" --target ${{ github.sha }} 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "release $tag may already exist, continuing" }
          # -Encoding UTF8 is required: the template holds Chinese and has no BOM.
          $notes = Get-Content -Raw -Encoding UTF8 launcher\release-notes-portable.md
          if (-not $notes) { throw "cannot read launcher/release-notes-portable.md, release body would be empty" }
          $notes = $notes.Replace('{{VERSION}}', "${{ steps.ver.outputs.version }}")
          $notes = $notes.Replace('{{TOTAL_GB}}', "${{ steps.gate.outputs.total_gb }}")
          $bodyFile = Join-Path $env:RUNNER_TEMP "portable-release-body.md"
          [System.IO.File]::WriteAllText($bodyFile, $notes, (New-Object System.Text.UTF8Encoding($false)))
          gh release edit $tag --notes-file $bodyFile

      - name: 上传全部分卷与校验文件
        if: github.event_name == 'push' || inputs.upload_to_release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $skip = @('upload-list.txt')
          $files = @(Get-ChildItem $env:BUNDLE_DIR -File | Where-Object { $skip -notcontains $_.Name })
          if ($files.Count -eq 0) { throw "no artifacts to upload" }
          foreach ($f in $files) {
            Write-Host "uploading $($f.Name) ($([math]::Round($f.Length/1MB,1)) MB)"
            gh release upload $tag $f.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "upload failed: $($f.Name)" }
          }
          gh release view $tag --json assets -q '.assets[].name'
