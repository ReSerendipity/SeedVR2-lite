# SeedVR2 Release 工作流 — GPG 签名（手动兜底）
#
# 对 GitHub Release 上已存在的 `SHA256SUMS.txt` 做 GPG 分离签名并上传
# `SHA256SUMS.gpg`，供进阶用户验证发行产物未被篡改（CWE-912）。
#
# 定位：常规签名已由 `portable-release.yml` 的 `sign-release` job 在
# 发布链路内自动完成。本工作流仅用于事后补签（如发布时 secrets 尚未配置、
# 或需要为历史 Release 追加签名）。
#
# 触发方式:
#   - workflow_dispatch（主用途，输入 tag；留空取最新 Release）
#   - release: published（仅当 Release 由人/PAT 创建时才会被唤起；
#     Actions 的 gh release create 不会触发该事件）
#
# 前提（仓库 Settings > Secrets and variables > Actions）:
#   - GPG_PRIVATE_KEY: ASCII-armored 私钥（gpg --armor --export-secret-keys KEY_ID）
#   - GPG_PASSPHRASE:  私钥口令
#   - GPG_KEY_ID:      密钥指纹（可选，缺省用默认私钥）
# 私钥未配置时本工作流以 notice 跳过（不算失败）；配置后任何失败都必须红灯。
#
# 验证公钥随仓库发布：website/docs/guide/release-signing-key.asc
# 用户验证方式:
#   gpg --import release-signing-key.asc
#   gpg --verify SHA256SUMS.gpg SHA256SUMS.txt
#   sha256sum -c SHA256SUMS.txt

name: GPG-Signed Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要签名的 Release tag（留空取最新 Release）"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: gpg-sign-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  sign-release-manual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - name: Skip when GPG secrets are not configured
        if: env.GPG_PRIVATE_KEY == ''
        run: echo "::notice::GPG_PRIVATE_KEY not configured - nothing to do (portable-release sign-release job covers the normal path)"

      - name: Determine tag
        if: env.GPG_PRIVATE_KEY != ''
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG=$(gh release list --limit 10 --json tagName,isDraft --jq '[.[] | select(.isDraft|not)][0].tagName')
          [ -n "$TAG" ] || { echo "::error::no release found to sign"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "signing release: $TAG"

      - name: Fetch existing SHA256SUMS.txt
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sign-work
          if ! gh release download "${{ steps.tag.outputs.tag }}" --pattern 'SHA256SUMS.txt' --dir sign-work; then
            echo "::error::Release '${{ steps.tag.outputs.tag }}' has no SHA256SUMS.txt to sign."
            echo "发布链路由 portable-release.yml 生成清单；历史 Release 若无清单，请先手动运行 scripts/build_portable_bundle.ps1 产出并上传。"
            exit 1
          fi
          cat sign-work/SHA256SUMS.txt

      - name: Import key, sign and verify
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          cd sign-work
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID_ARGS=()
          if [ -n "$GPG_KEY_ID" ]; then KEYID_ARGS=(--local-user "$GPG_KEY_ID"); fi
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 "${KEYID_ARGS[@]}" \
            --output SHA256SUMS.gpg --detach-sign SHA256SUMS.txt <<< "$GPG_PASSPHRASE"
          gpg --verify SHA256SUMS.gpg SHA256SUMS.txt

      - name: Upload signature
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 签名是 SHA256SUMS.txt（不可变资产）的派生物：同一输入产出同一签名字节，
          # 重跑覆盖安全，与发行资产的不可变策略不冲突。
          gh release upload "${{ steps.tag.outputs.tag }}" sign-work/SHA256SUMS.gpg --clobber
          echo "SHA256SUMS.gpg uploaded for ${{ steps.tag.outputs.tag }}"

      - name: Append verification instructions (idempotent)
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BODY=$(gh release view "$TAG" --json body -q .body)
          case "$BODY" in
            *'完整性校验'*) echo "body already has verification section, skip" ;;
            *)
              printf '\n\n---\n\n## 🔐 完整性校验（可选）\n\n直接下载安装即可，普通用户无需校验。进阶用户可验证产物未被篡改：\n\n```bash\nsha256sum -c SHA256SUMS.txt\ngpg --import release-signing-key.asc   # 公钥见仓库 website/docs/guide/\ngpg --verify SHA256SUMS.gpg SHA256SUMS.txt\n```\n' > note.md
              gh release edit "$TAG" --notes-file <(printf '%s\n' "$BODY"; cat note.md)
              ;;
          esac
