name: Docs Consistency
on:
  pull_request:
    paths: ['**/*.md', '.pre-commit-config.yaml', 'package.json', 'pyproject.toml', '.github/workflows/**']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  spec-refs:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— 版本口径门禁要读 tag，浅克隆拿不到（脚本会硬失败而不是静默跳过）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Audit spec references
        run: python scripts/check_spec_refs.py
      - name: Check reference availability (no phantom refs to undistributed local files)
        run: python scripts/check_local_only_refs.py --all
      - name: Check README release version matches published tags
        run: python scripts/check_readme_release_version.py
      - name: Check release state (pyproject / CHANGELOG vs published tags)
        # README 那条只管对外声明；这条管"代码里写着的版本号有没有真发过"——v1.5.8 曾以
        # pyproject + CHANGELOG 双在册、却无任何 tag/Release 的状态挂了 9 天而无门禁报警。
        run: python scripts/check_release_state.py
