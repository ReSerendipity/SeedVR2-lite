name: Docs Consistency
on:
  pull_request:
    paths: ['**/*.md', '.pre-commit-config.yaml', 'package.json', '.github/workflows/**']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  spec-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit spec references
        run: python scripts/check_spec_refs.py
      - name: Check reference availability (no phantom refs to undistributed local files)
        run: python scripts/check_local_only_refs.py --all
