name: CI - Backend Quality Gate

on:
  pull_request:
    branches: [main]
    # 刻意不放 paths-ignore：quality-gate (ubuntu/windows) 与 Typecheck (mypy ratchet)
    # 都是 main 的必需检查，而 workflow 级过滤掉的 workflow **不产生任何 check run**，
    # 必需检查就永远停在 Expected、纯文档 PR 直接冻死（#99/#101 实测卡 BLOCKED，
    # 20 项已上报的检查全绿也没用）。该过滤自 3e59722（2026-08-30）起存在。
    # 快路径只能给非必需检查用（见 jobs.changes 的注释）；必需的两组在 PR 上恒跑。
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'demo/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  # 判定本批改动是否与后端门禁相关，目前只喂给 security-assertions（非必需检查）。
  # **不要把它接到 quality-gate / typecheck 的 job 级 `if` 上**：必需检查的 context 名带矩阵
  # 后缀（`quality-gate (ubuntu-latest)`），而被 `if` 跳过的 job 只登记一个裸名 `quality-gate`
  # 的 skipped 记录，名字对不上 → 必需检查依旧不满足，纯文档 PR 仍卡 BLOCKED。
  # （#102 就是这个形态，在 #99/#101 上实测确认）
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        # 表达式一律经 env 传入，绝不直接插进 run：分支名等字段属可影响字符串，
        # 内插等于把 Actions 脚本注入面交给提交者
        # （semgrep yaml.github-actions.security.run-shell-injection，ERROR 阻断）
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          else
            files="$(git diff --name-only "$HEAD_SHA^" "$HEAD_SHA")"
          fi
          if [ -n "$(printf '%s\n' "$files" | grep -vE '^(docs|website|demo)/|\.md$' | head -1)" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
          echo "--- 参与判定的变更 ---"
          printf '%s\n' "$files" | head -20

  quality-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows runner 默认 stdout 编码为 cp1252，无法输出中文/emoji（如 check_config_refs 的
    # [INFO] 解析到…），会触发 UnicodeEncodeError 导致配置一致性门禁崩溃。强制 UTF-8 输出。
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies (Windows, hash-locked)
        if: matrix.os == 'windows-latest'
        # Windows 与锁平台一致（同 dependency-audit.yml 的先例）：torch 2.13.0+cu132 的
        # 索引页只提供 PEP 658 元数据、无轮子哈希锚点，锁内该包哈希为 Windows 轮实测值，
        # 故 Windows 侧走 --require-hashes 真实锁安装（可复现）。
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt --extra-index-url https://download.pytorch.org/whl/cu132
          pip check

      - name: Install dependencies (Linux, requirements)
        if: matrix.os == 'ubuntu-latest'
        # torch +cu132 本地版本的 Linux 轮子暂无公开哈希（见上），锁安装暂不可跨平台；
        # ubuntu 侧保持 requirements 安装，待 torch 索引补齐哈希锚点后统一接入锁。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip check

      - name: Ruff (lint)
        run: python -m ruff check .

      - name: Config-vs-code consistency gate (security, runtime.security)
        # 配置幻觉根因门禁（安全评估 #13）：config.yaml runtime.security 段每个键都必须被
        # 代码真实消费，且 runtime / runtime.security 的键须对应配置模型字段；声明不消费即失败。
        run: |
          pip install pyyaml
          python scripts/check_config_refs.py

      - name: Front/back API contract audit (routes · docs · form fields · handlers)
        # 契约一致性门禁（2026-09-03 前后端契约审计固化）：前端调用的路径/方法、提交的表单字段、
        # 内联 onclick 引用的函数、/static/ 资源，以及网站 API 文档写出的端点，都必须后端/磁盘
        # 真实存在。独立成步而非只靠全量 pytest 间接覆盖，是为了在 CI 日志里一眼定位「契约回退」，
        # 而不是在几百行用例输出中翻找。
        run: |
          python -m pytest tests/test_api_contract.py -q
          python scripts/audit_api_consistency.py all

      - name: Black (format check)
        run: python -m black --check .

      - name: Pytest + coverage
        # 测试失败（含收集失败）必须让 job 失败：本步骤是真实质量门禁，不得加 || true
        run: python -m pytest -q --ignore=tests/perf --cov=app/integrated_app --cov-report=xml --cov-report=html --cov-report=term

      - name: Quality gate (golden degraded pairs, data governance P1-3)
        # 数据治理门禁：合成 golden 源图 → 生产退化处理器 → color_fix → PSNR/SSIM 断言。
        # 纯 CPU 路径，不依赖 GPU/权重；独立成步以便在 CI 日志中一眼定位质量回退。
        # 测试失败必须让 job 失败：本步骤是真实门禁，不得加 || true
        run: python -m pytest tests/test_golden_quality.py -q -m integration

      - name: Golden dataset manifest (regenerate + diff check)
        # 校验退化流水线确定性：重新生成基准对，manifest 指标须与已提交基线一致
        shell: bash
        run: |
          python scripts/generate_golden_dataset.py --size 128 --output tests/golden --skip-images
          # 仅比对指标内容；--ignore-cr-at-eol 规避跨平台换行符差异造成的误报
          git diff --ignore-cr-at-eol --exit-code -- tests/golden/manifest.json

      - name: Coverage Gate (>= 55%)
        if: always()
        shell: bash
        run: |
          python - <<'PYEOF'
          import os, xml.etree.ElementTree as ET
          if not os.path.exists('coverage.xml'):
              # docs-only / non-code PRs skip the test run and produce no
              # coverage artifact; don't hard-fail the quality gate for those.
              print('[WARN] coverage.xml not found - skipping coverage gate (docs-only / non-code change without a test run)')
              raise SystemExit(0)
          rate = float(ET.parse('coverage.xml').getroot().get('line-rate'))
          pct = rate * 100
          print(f'Line coverage: {pct:.1f}%')
          if pct < 55:
              raise SystemExit(f'[FAIL] coverage {pct:.1f}% < 55%')
          print('[PASS] coverage meets 55% threshold')
          PYEOF
      - name: Upload coverage XML
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.os }}
          path: coverage.xml

      - name: Upload coverage HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}
          path: htmlcov/

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # 类型门禁（家族底线；2026-09-03 迁移至组织级 reusable workflow）
  # 原先嵌在 quality-gate 双 OS 矩阵里跑两份相同的 mypy（类型错误与 OS 无关，
  # 且双 runner 依赖版本漂移会让两端口径悄悄分家），改为独立 job 单点执行。
  # 本仓不建 .ci/mypy_baseline.txt：模板对缺失基线走零容忍（当前口径 0 错误，
  # 出现任何新错误即红）。口径＝mypy 2.3.1 + pydantic（pyproject 声明了
  # pydantic.mypy 插件）；升级 mypy 版本或改 typecheck_extra_pip 前必须复测。
  # （原步骤见 git 历史；迁移记录 docs/reports/mypy-ratchet-组织级门禁迁移_20260903.md 为维护者本地文件，未随仓库分发）
  typecheck:
    name: Typecheck (mypy ratchet)
    uses: ReSerendipity/.github/.github/workflows/python-quality-baseline.yml@main
    with:
      package: app/integrated_app
      include_tests: false
      mypy_target: app/integrated_app
      typecheck_extra_pip: pydantic
    permissions:
      contents: read

  # ── 安全断言（部署安全红线，2026-08-17 新增） ──────────────────
  security-assertions:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 禁止 0.0.0.0 监听
        run: |
          HITS=$(grep -rn --include='*.py' --include='*.bat' --include='*.sh' --include='*.yml' \
            -E "host[[:space:]]*=[[:space:]]*['\"]0\.0\.0\.0|--host[[:space:]]+0\.0\.0\.0" \
            app backend config.yaml start.bat start.sh 2>/dev/null | grep -v tests || true)
          if [ -n "$HITS" ]; then echo "FAIL: 发现 0.0.0.0 监听配置"; echo "$HITS"; exit 1; fi
          echo "PASS: 无 0.0.0.0 监听配置"
      - name: 入口文件一致性
        run: |
          test -f app/clean_launch.py || test -f backend/main.py || exit 1
          test -f requirements.txt
          echo "PASS: 入口与依赖清单存在"
      - name: 依赖锁存在性
        run: |
          test -f requirements-lock.txt || (echo "FAIL: 缺少 requirements-lock.txt" && exit 1)
          echo "PASS: 依赖锁存在"
      - name: Setup Python (for integrity gate)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 完整性清单一致性（发布门禁）
        # 发布版 config.yaml 为 integrity_enforce: true（构建期注入），清单与代码一旦漂移，
        # 用户端启动自检会**直接拒绝启动**而非仅告警（GOTCHAS #114）。此处提前拦截漂移进入 main。
        run: |
          python -m pip install --quiet --disable-pip-version-check pyyaml cryptography
          python scripts/verify_release_integrity.py
          echo "PASS: 核心模块完整性清单与代码一致且签名有效"
