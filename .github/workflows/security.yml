name: Security Scan (SAST)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'  # 每周一凌晨 4 点

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: "Semgrep Scan (report-only, crash-blocking)"
        # 显式软门禁（DX 评估 P2-2）：实测 semgrep 1.173.0 + `--config auto --severity ERROR`
        # 在本仓有 10 条 ERROR findings（torch.load 系列已人工批注 nosemgrep、2 处 Actions
        # 变量插值为维护者已知模式）。若加 `--error` 会立即把 main 打红，违反 CI 铁律。
        # 当前策略：本步骤只验证 semgrep 自身可运行（工具 crash 才红），findings 一律经
        # 下方 SARIF 上报 GitHub Security 告警区人工分诊。
        # 升级为硬门禁的路径：先清零 ERROR findings（修复，或改用完整规则 ID 的 nosemgrep
        # 且确认对多行匹配生效），再在命令末尾追加 `--error`。
        run: |
          python -m pip install semgrep==1.173.0
          semgrep scan --config auto --severity ERROR

      - name: Semgrep SARIF (all severities)
        # 全量告警（含 WARNING/MEDIUM 与 nosemgrep 抑制项）进 SARIF 上报，不参与门禁。
        # || true 仅作用于报告步骤：semgrep 自身故障由上方 gate 步骤暴露，不再被静默。
        if: always()
        run: |
          semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  # 密钥泄露扫描 — 学习 Image_MultiModel 的 Trivy FS 模式
  # 扫描仓库历史中的密钥/Token 泄露，防止凭据意外提交。
  secret-scan:
    name: Secret Scanning (Trivy FS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy secret scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (2026-04-22 官方攻击响应后最新稳定版; SHA pin 防 tag 强更)
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'secret'
          scan-ref: '.'
