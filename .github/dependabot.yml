# 依赖自动更新（供应链安全：配合 dependency-audit.yml 的 pip-audit/safety/npm audit）
# 详见 AGENTS.md §5 依赖管理。
version: 2
updates:
  # Python 生产/开发依赖（哈希锁文件 requirements-lock.txt 由
  # scripts/generate_lock.py 生成，PR 合入后需重新生成）
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # E2E 测试 Playwright 依赖
  - package-ecosystem: npm
    directory: "/tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # 文档站 VitePress 依赖
  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions 工作流依赖
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
