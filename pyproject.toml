[project]
name = "seedvr2-lite"
version = "1.5.1"
description = "SeedVR2 - AI-powered video & image super-resolution toolkit"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "ReSerendipity"},
]
maintainers = [
    {name = "ReSerendipity Team"},
]
keywords = [
    "video-super-resolution",
    "image-super-resolution",
    "diffusion-models",
    "dit",
    "video-restoration",
    "ai-upscaler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime uses the project-local .venv created by install.bat / install.sh (unified
# with start.bat / precheck.ps1; bundled WinPython kept as legacy fallback - see
# docs/project/CONSTRAINTS.md). Keep ruff / black / mypy target versions aligned
# with this value to avoid tool drift.
# 上界 <3.15：uv 需对区间内所有 Python 版本做通用解析，未发布的 3.15 无
# torchaudio 轮子会导致解析不可满足（2026-08-30 Dependabot 重锁时发现）。
requires-python = ">=3.12,<3.15"

dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    # Template & Frontend
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    # Deep Learning
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
    # Model & Inference
    "transformers>=4.44.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.25.0",
    "einops>=0.8.0",
    "omegaconf>=2.3.0",
    "diffusers>=0.30.0",
    "mediapy>=1.1.0",
    "rotary-embedding-torch>=0.5.0",
    # Video Processing
    "opencv-python>=4.10.0",
    "imageio>=2.35.0",
    "imageio-ffmpeg>=0.5.0",
    "pillow>=10.4.0",
    # Database
    "aiosqlite>=0.20.0",
    # Utilities
    "aiofiles>=24.1.0",
    "psutil>=6.0.0",
    "rich>=13.8.0",
    "PyWavelets>=1.9.0",
]

# 开发 / 测试 / 工具依赖（与 requirements-dev.txt 保持一致）
[dependency-groups]
dev = [
    "black==26.5.1",
    "mypy==2.3.0",
    "ruff==0.16.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "factory-boy>=3.3",
    "cryptography>=42.0",
]

# ── uv 配置 ────────────────────────────────────────────────────────────────
# `uv sync` 即可安装全部运行依赖（默认含 dev 组）。
# torch 系列从 cu132 源安装（与 install.bat 自动探测结果、requirements-lock.txt、
# 本机运行环境 torch 2.13.0+cu132 三处一致）。2026-09-06 起便携包交付轨也统一到
# cu132（build_portable_bundle.ps1 同参数），双轨分叉消除；torch ≤2.12.1 曾被
# Dependabot 标记漏洞告警，2.13.0 已在其之上。
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
# torchaudio 不指到 CUDA 源：实际运行环境用 PyPI 的 2.11.0（CPU 轮，与 torch 2.13.0+cu132
# 搭配正常，requirements-lock.txt 同源）；cu132 源没有对应轮子

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

# Numerical / tensor / diffusion code follows ML and PyTorch naming conventions
# (e.g. tensor dims B/C/H/W/T, matrix names, `import torch.nn.functional as F`,
# `input` as an nn.Module.forward argument, math index `l`). Renaming these in
# the (test-uncovered) inference and signal-processing core would hurt
# readability and risk silent breakage, so the naming/builtin-shadow rules are
# scoped off there instead of rewritten.
[tool.ruff.lint.per-file-ignores]
"model_lib/**" = ["N801", "N802", "N803", "N806", "N812", "N815", "E741", "A001", "A002"]
"app/models/**" = ["N801", "N802", "N803", "N806", "N812", "N815", "E741", "A001", "A002"]
"app/vram/**" = ["N806", "N812"]
"app/utils/experiment_tracker.py" = ["SIM115"]
"perf/benchmark/flash_attention_benchmark.py" = ["N806"]
"training/distributed_trainer.py" = ["N806", "N817", "N801"]
"common/diffusion/**" = ["N802", "N803", "N806", "N812", "N815", "E741"]
"common/utils.py" = ["N812"]
"app/integrated_app/optimization/**" = ["N801", "N802", "N803", "N806", "N812", "A001", "A002"]
"app/clean_launch.py" = ["N806"]
"data/test/image/**" = ["N802", "N812"]
# Test module groups imports into commented sections by concern.
"tests/test_refactor_e4_b2.py" = ["E402"]
# Smoke-test script must set sys.path before importing project modules.
"scripts/smoke_test_security.py" = ["E402"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
# Pydantic ships a mypy plugin that models Field()/default_factory/validators
# correctly; without it BaseModel fields are misreported.
plugins = ["pydantic.mypy"]
# Gradual-typing adoption: keep real type-error detection (assignment, arg-type,
# return-value, attr-defined, union-attr, ...) on across first-party code, but do
# not force full annotation coverage on this legacy codebase. The vendored ML
# research core under model_lib/ mirrors upstream and is excluded from checking.
strict = false
warn_return_any = false
warn_unused_ignores = false
check_untyped_defs = true
# Anchor module resolution at the project root so files are named from the
# `app.integrated_app.*` import path (matching runtime) and are not discovered
# twice under an ambiguous `integrated_app.*` name.
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
# Vendored ByteDance research code (Apache-licensed, mirrors upstream); not
# strict-typed or maintained for annotations here.
exclude = "^model_lib/"

# Third-party libraries without bundled type stubs.
[[tool.mypy.overrides]]
module = [
    "torch.*", "torchvision.*", "einops.*", "cv2.*", "PIL.*", "numpy.*",
    "omegaconf.*", "safetensors.*", "aiosqlite.*", "psutil.*", "xformers.*",
    "torchao.*", "pywt.*", "diffusers.*", "transformers.*", "yaml.*",
    "aiofiles.*", "cryptography.*", "imageio_ffmpeg.*",
]
ignore_missing_imports = true

# Vendored ML research core and untested torch-heavy numeric/perf modules:
# these mirror upstream research code or are GPU-only optimization paths with no
# test coverage, so type-checking is scoped off (type checks still run on the
# maintained, tested application layer).
[[tool.mypy.overrides]]
module = [
    "model_lib.*", "common.distributed.*", "common.diffusion.*",
    "app.integrated_app.optimization.*", "app.integrated_app.engines.*",
]
ignore_errors = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --tb=short --timeout=60"
markers = [
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
    "benchmark: marks benchmark tests",
]

[tool.coverage.run]
# Coverage is measured only for the standalone web application layer. The
# inference core (model_lib/, common/) requires a real CUDA GPU and model weights
# to exercise, which the test suite deliberately avoids (see AGENTS.md 6.6);
# including those paths here would report near-zero coverage and mask the
# app-layer signal. Regression safety for the core relies on the engine
# self-check (verify_engine.py) plus end-to-end runs instead.
branch = true
source = ["app/integrated_app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    # ── GPU-only optimization paths — require real CUDA hardware to exercise ──
    # These modules contain tensor operations that cannot run without a GPU.
    # Regression safety relies on verify_engine.py + end-to-end runs instead.
    "*/optimization/gpu/gpu_compatibility.py",
    "*/optimization/gpu/vram_monitor.py",
    "*/optimization/gpu/vram_toolchain.py",
    "*/optimization/gpu/blockswap.py",
    "*/optimization/gpu/memory_manager.py",
    "*/optimization/gpu/cache_manager.py",
    # Inference & video optimization: DiT sampling, VAE tiled enhance, temporal
    # processing — all require a loaded model + CUDA tensors to exercise.
    "*/optimization/inference/diffusion_sampling.py",
    "*/optimization/inference/dit_optimization.py",
    "*/optimization/inference/post_processing.py",
    "*/optimization/inference/temporal_processing.py",
    "*/optimization/inference/tile_blend.py",
    "*/optimization/inference/vae_tiled_enhance.py",
    "*/optimization/video/video_processing_enhance.py",
    # Engine pipeline mixins — require real CUDA + model weights to exercise.
    "*/engines/_vae_pipeline.py",
    "*/engines/_dit_pipeline.py",
    "*/engines/_video_pipeline.py",
    "*/engines/_image_pipeline.py",
    "*/engines/_memory_utils.py",
    "*/engines/seedvr2_engine.py",
    # NOTE: progress.py, optimization/license_compliance.py, optimization/roadmap.py
    # are pure-Python logic (no GPU/tensor deps) and are NOT omitted — they should
    # be covered by unit tests and count toward the coverage gate.
]

[tool.coverage.report]
# 50 与 ci.yml（coverage.xml line-rate >= 50）及 precheck.ps1 的门禁一致。
# 原 70 从未真实生效（HEAD 基线实测最高 ~68%，见 AGENTS.md 修订 v1.36 / KNOWN_ISSUES #34）；
# 回升路线见 AGENTS.md §4.2（M1 目标 70）。
fail_under = 50
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"
