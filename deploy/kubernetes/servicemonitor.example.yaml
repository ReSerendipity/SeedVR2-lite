# SeedVR2 —— ServiceMonitor 样例（云原生评估 P2-3 可观测接线，2026-09-06）
#
# ⚠ 依赖提示：本资源属于 prometheus-operator 的 CRD（monitoring.coreos.com/v1）。
#   集群未安装 Prometheus Operator 时 `kubectl apply` 会报
#   "no matches for kind ServiceMonitor"——这不是清单错误，需先装 operator，
#   或改用原生 Prometheus 的 scrape_config（job 指向 svc seedvr2:80 的 /metrics）。
#
# 抓取端点事实依据（2026-09-06 实测）：
#   - 路径 /metrics：app/integrated_app/routes/system/prometheus_metrics.py 注册的
#     根级标准 Prometheus 端点（text/plain; version=0.0.4），tests/test_cloud_native.py
#     已覆盖指标族契约；
#   - CSRF/鉴权：CSRFMiddleware 仅拦非安全方法（GET 放行）；但启用 Basic 认证
#     （BASIC_AUTH_* 环境变量）时 basic_auth 中间件会拦下**所有**路径（含 /metrics），
#     此时需在 endpoints 下加 basicAuth 凭据，或集群内网保持 Basic 认证关闭；
#   - 指标内容：uptime / 显存与利用率 / 推理计数与耗时 / 缓存统计（无敏感数据）。
#
# Service 端口名对齐 deploy/kubernetes/service.yaml 的 ports[].name: http。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: seedvr2
  labels:
    app: seedvr2
    # 按集群 Prometheus 的 serviceMonitorSelector.matchLabels 调整，否则不被发现
    release: prometheus
spec:
  selector:
    matchLabels:
      app: seedvr2
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # 启用 Basic 认证时的抓取凭据示例（凭据走 Secret，勿明文入库）：
      # basicAuth:
      #   username:
      #     name: seedvr2-scrape-credentials
      #     key: username
      #   password:
      #     name: seedvr2-scrape-credentials
      #     key: password
