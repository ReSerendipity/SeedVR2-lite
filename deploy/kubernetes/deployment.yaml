# SeedVR2 GPU 推理 Deployment（对应云原生评估报告 P2-7）
#
# 编排单元约束：1 Pod = 1 GPU = 1 模型档位（3B 或 7B）。
# 模型引擎为进程内单例（gunicorn -w 1），横向扩容只能通过增加副本 × GPU 卡，
# 由外部队列/网关做负载分担，禁止把 replicas 当 CPU 服务随意拉高。
#
# 上线前必改项（搜索 "TODO"）：
#   1. image: 替换为实际推送的 ghcr.io 镜像 + 版本化 tag（禁 latest）
#   2. 预填充 model-weights PVC（镜像不含权重：用 scripts/download_model.py 下载后
#      拷入；单节点实验可回退 hostPath，见 volumes 注释）
#   3. resources: 按 3B / 7B 档位与 FP8 / FP16 精度调整显存与内存
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seedvr2
  labels:
    app: seedvr2
spec:
  # GPU 独占 + 模型加载耗时长：节点维护/升级时先终止旧 Pod（释放 GPU）再启新 Pod
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: seedvr2
  template:
    metadata:
      labels:
        app: seedvr2
    spec:
      terminationGracePeriodSeconds: 120 # ≥ 容器内 gunicorn --graceful-timeout 90（队列排空 + 模型卸载）
      securityContext:
        # UID/GID 钉版 1000，与镜像内 appuser（Dockerfile groupadd --gid 1000）一致，
        # 改动任一侧必须同步另一侧；fsGroup 让 PVC/emptyDir 卷对进程属组可写
        # （非 root 容器写卷的标准解法，云原生评估 P2-5）。
        runAsNonRoot: true # CWE-250
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        # NVIDIA device plugin 会为 GPU 节点打上 NoSchedule 污点，必须容忍才能调度
        - key: nvidia.com/gpu
          operator: Equal
          value: "present"
          effect: NoSchedule
      affinity:
        nodeAffinity:
          # GPU 节点亲和：优先走 device plugin 的容量标签；
          # 若集群部署了 NFD，可按 nvidia.com/gpu.product 进一步锁定卡型
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.present
                    operator: In
                    values: ["true"]
      containers:
        - name: seedvr2
          # TODO: 替换为实际镜像 tag（由 docker-publish.yml 产出，禁 latest；
          # 原 1.0.0 为过期示例，项目当前版本见 pyproject.toml）
          image: ghcr.io/reserendipity/seedvr2-lite:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7870
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # P3-8：CORS 经环境变量注入，替代硬编码 localhost（按 Ingress 域名修改）
            - name: SEEDVR2_ALLOWED_ORIGINS
              value: "https://seedvr2.example.com"
            - name: LOG_LEVEL
              value: "INFO"
            # Basic Auth（评估报告 R1：暴露部署 fail-closed）。镜像内
            # SEEDVR2_DEPLOYMENT=container 会使未鉴权启动直接失败：
            # 部署前必填强密码（生产建议改用 Secret keyRef 注入）
            - name: SEEDVR2_AUTH_USERNAME
              value: "admin" # TODO: 修改为实际运维账户
            - name: SEEDVR2_AUTH_PASSWORD
              value: "" # TODO(必填): 设置强密码；生产建议
              # valueFrom:
              #   secretKeyRef:
              #     name: seedvr2-auth
              #     key: password
          resources:
            requests:
              nvidia.com/gpu: 1 # 整卡独占（MIG 场景可改为 1.nvidia.com/gpu 分片）
              cpu: "4"
              memory: 16Gi
            limits:
              nvidia.com/gpu: 1
              cpu: "8"
              memory: 32Gi # TODO: 7B/FP16 档位建议上调；limits 缺失会导致节点显存耗尽（反模式 #2）
          # 探针三件套（报告 2.3）：
          startupProbe:
            # 慢初始化窗口：模型加载 + 权重 SHA256 校验 + 预热，最长容忍 300s（60 × 5s）。
            # 7B/FP16 或机械盘冷读实测超 300s 时，上调 failureThreshold 至 120（=600s）
            # （云原生评估 P2-7 分档建议，勿动 periodSeconds 以免拉长未就绪探测间隔）。
            httpGet:
              path: /api/system/ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            # 模型预热中 /api/system/ready 返回 503，不接流量
            httpGet:
              path: /api/system/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            # 轻量存活探针：仅判断进程活着，不做重资源检查
            httpGet:
              path: /api/system/ping
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: model-weights
              mountPath: /app/model
              readOnly: true
            - name: app-data
              mountPath: /app/data
            - name: app-outputs
              mountPath: /app/outputs
            - name: app-logs
              mountPath: /app/logs
      volumes:
        # 云原生评估 P1-1：持久化三连——权重/数据/产物全部 PVC 化（清单见 pvc.yaml）。
        # 单节点实验回退 hostPath 示例（目录属主需 1000:1000 或依赖 fsGroup 修正）：
        #   hostPath:
        #     path: /srv/seedvr2/model
        #     type: Directory
        - name: model-weights
          persistentVolumeClaim:
            claimName: seedvr2-model-weights
        - name: app-data
          persistentVolumeClaim:
            claimName: seedvr2-data
        - name: app-outputs
          persistentVolumeClaim:
            claimName: seedvr2-outputs
        # 日志为 stdout 结构化 JSON 的临时缓冲（LOG_FORMAT=json），无需持久化
        - name: app-logs
          emptyDir: {}
