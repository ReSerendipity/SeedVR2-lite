restore:
  default_resolution_h: 1080
  default_resolution_w: 1920
  default_scale_factor: 2.0
  detail_enhancement: cinematic
  seed: 42
  sp_size: 1
  temporal_consistency: 0.8
retention:
  disk_min_free_gb: 5.0
  outputs_cleanup_interval_seconds: 3600
  outputs_max_age_days: 14
  outputs_max_files: 0
runtime:
  batch:
    max_retries: 2
    retry_base_delay_seconds: 1.0
    retry_max_delay_seconds: 30.0
  retry:
    base_delay_seconds: 1.0
    enabled: true
    max_delay_seconds: 30.0
    max_retries: 2
    oom_breaker:
      cooldown_seconds: 600.0
      enabled: true
      threshold: 3
  security:
    allowed_base_dirs:
    - outputs/
    - data/uploads/
    - data/checkpoints/
    - model/
    integrity_enforce: false
    integrity_recheck_interval_seconds: 1800
    max_upload_image_mb: 50
    max_upload_video_mb: 500
    rate_limit_per_minute: 30
  sse:
    heartbeat_interval_seconds: 30
    max_duration_seconds: 300
    poll_interval_seconds: 0.5
  task:
    auto_recover: false
    checkpoint_dir: data/checkpoints
    checkpoint_every: 1
    id_length: 16
    keep_last_epoch_checkpoints: 2
    max_timeout_seconds: 86400
    progress_stall_timeout_minutes: 30
    queue_maxsize: 100
    stale_threshold_minutes: 30
  upload:
    chunk_size_bytes: 8192
    large_file_threshold_mb: 10
server:
  allowed_origins:
  - http://127.0.0.1:7870
  - http://localhost:7870
  auto_open_browser: true
  debug: false
  host: 127.0.0.1
  port: 7870
user_preferences:
  accordion_expanded_groups:
  - basic
  - condition
  blocks_to_swap: 0
  blockswap_enabled: false
  default_batch_size: 5
  default_cfg_scale: 3.0
  default_color_correction: lab
  default_denoising_strength: 0.6
  default_max_resolution: 0
  default_model: 3b_fp16
  default_resolution: 2048
  default_sampler: dpmpp_2m_sde
  default_seed: -1
  default_steps: 20
  default_vae: ema_vae_fp16
  output_format: png
  output_path_template: '{input_dir}/restored/{input_name}{ext}'
  output_quality: 95
  recent_model_path: ''
  restore_form_values: {}
  restore_unlock_state: {}
  slider_comparison_enabled: true
  step_execution_enabled: false
  vae_tile_size: 512
  vae_tiling_enabled: false
