repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
    # 格式化交给下面的 black（CI 与 precheck 同样跑 black --check）。
    # 不要在此再加 ruff-format：它与 black 的折行规则存在分歧，两个 formatter
    # 同时强制会让「提交时被 ruff 改写、push 时被 black 拒绝」来回翻转
    # （实测见 KNOWN_ISSUES #61）。

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        args: [--config, pyproject.toml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  # mypy 走项目 .venv（pydantic 插件与第三方 stub 依赖项目环境，isolated env 会缺依赖报错）。
  # 仅 app/integrated_app 下有 .py 改动时触发，口径与 run_checks.bat / ci.yml 一致。
  # Linux 贡献者请把 entry 改为 .venv/bin/python。
  - repo: local
    hooks:
      - id: mypy
        name: mypy app/integrated_app
        entry: .venv/Scripts/python.exe -m mypy app/integrated_app
        language: system
        pass_filenames: false
        files: ^app/integrated_app/.*\.py$
